<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="reprobot: it runs the bug report">
  <defs>
    <radialGradient id="glow" cx="0.28" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#1b2a2f"/>
      <stop offset="1" stop-color="#0a1114"/>
    </radialGradient>
    <pattern id="heap" width="40" height="28" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="36" height="24" rx="3" fill="none" stroke="#1e2c31" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#glow)"/>
  <rect width="1280" height="420" rx="28" fill="url(#heap)" opacity=".55"/>
  <!-- the overflowing write: a row of heap cells, the last one hits a redzone -->
  <g transform="translate(560 318)">
    <rect x="0" y="0" width="36" height="24" rx="3" fill="#c8a45c" opacity=".9"/>
    <rect x="40" y="0" width="36" height="24" rx="3" fill="#c8a45c" opacity=".75"/>
    <rect x="80" y="0" width="36" height="24" rx="3" fill="#c8a45c" opacity=".6"/>
    <rect x="120" y="0" width="36" height="24" rx="3" fill="#c8a45c" opacity=".45"/>
    <rect x="160" y="0" width="36" height="24" rx="3" fill="#e0563f"/>
    <path d="M168 6l20 12M188 6l-20 12" stroke="#0a1114" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- hound -->
  <g transform="translate(70 40) scale(1.3)">
    <path d="M2 270H298" stroke="#31454b" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>
    <g transform="rotate(-12 34 250)"><rect x="12" y="232" width="44" height="34" rx="3" fill="#efe7d6"/><path d="M20 243h28M20 252h18" fill="none" stroke="#e0563f" stroke-width="3.5" stroke-linecap="round"/></g>
    <ellipse cx="186" cy="270" rx="84" ry="5" fill="#000" opacity=".3"/>
    <path d="M246 168Q278 152 266 114" fill="none" stroke="#efe7d6" stroke-width="14" stroke-linecap="round"/>
    <rect x="132" y="210" width="22" height="58" rx="11" fill="#c8a45c"/><rect x="224" y="210" width="22" height="58" rx="11" fill="#c8a45c"/>
    <rect x="116" y="148" width="140" height="80" rx="40" fill="#efe7d6"/>
    <rect x="152" y="212" width="23" height="56" rx="11.5" fill="#efe7d6"/><rect x="204" y="212" width="23" height="56" rx="11.5" fill="#efe7d6"/>
    <circle cx="174" cy="186" r="11" fill="#e0563f" stroke="#b7a983" stroke-width="2"/>
    <circle cx="200" cy="186" r="11" fill="#e0563f" stroke="#b7a983" stroke-width="2"/>
    <circle cx="226" cy="186" r="11" fill="#e0563f" stroke="#b7a983" stroke-width="2"/>
    <g transform="translate(0 -8)">
      <rect x="124" y="150" width="14" height="42" rx="4" fill="#8c6f36" transform="rotate(18 131 170)"/><circle cx="126" cy="198" r="6.5" fill="#e0563f" stroke="#8c6f36" stroke-width="2"/>
      <circle cx="96" cy="150" r="54" fill="#efe7d6"/>
      <rect x="32" y="158" width="68" height="44" rx="22" fill="#efe7d6" transform="rotate(-16 70 180)"/>
      <path d="M48 200q9 8 22 1" fill="none" stroke="#0a1114" stroke-width="3" stroke-linecap="round"/>
      <circle cx="40" cy="186" r="10" fill="#0a1114"/><circle cx="37" cy="182" r="3" fill="#fff" opacity=".5"/>
      <circle cx="68" cy="170" r="9" fill="#e8a79a" opacity=".75"/>
      <circle cx="78" cy="140" r="10.5" fill="#0a1114"/><circle cx="74.5" cy="136" r="3.8" fill="#fff"/><circle cx="82" cy="144" r="1.8" fill="#fff" opacity=".7"/>
      <g><rect x="100" y="116" width="42" height="88" rx="21" fill="#c8a45c"/><rect x="108" y="150" width="26" height="46" rx="13" fill="#b08d47" opacity=".5"/></g>
      <path d="M24 168L8 158M20 184L0 184M24 200L8 210" fill="none" stroke="#e0563f" stroke-width="4.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- words -->
  <text x="560" y="150" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="104" fill="#efe7d6">reprobot</text>
  <text x="562" y="210" font-family="'Hanken Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" fill="#8b9b9d">Checks security reports by running them.</text>
  <g font-family="'Martian Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="19" font-weight="600">
    <rect x="562" y="240" width="262" height="44" rx="22" fill="#e0563f" fill-opacity=".14" stroke="#e0563f" stroke-width="2"/>
    <circle cx="588" cy="262" r="7" fill="#e0563f"/>
    <text x="604" y="269" fill="#e0563f">REAL CRASH  3 / 3</text>
    <rect x="842" y="240" width="250" height="44" rx="22" fill="#4fb58d" fill-opacity=".14" stroke="#4fb58d" stroke-width="2"/>
    <circle cx="868" cy="262" r="7" fill="#4fb58d"/>
    <text x="884" y="269" fill="#4fb58d">FIX HOLDS  0 / 3</text>
  </g>
  <text x="776" y="337" font-family="'Martian Mono', Menlo, Consolas, monospace" font-size="17" fill="#56676a">heap-buffer-overflow, WRITE of size 64</text>
</svg>
