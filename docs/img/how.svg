<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="How reprobot works: report, build, run three times sealed, verdict">
  <rect width="1280" height="300" rx="24" fill="#0a1114"/>
  <g font-family="'Hanken Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- arrows -->
    <g stroke="#31454b" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M318 120h34M342 110l10 10-10 10"/>
      <path d="M628 120h34M652 110l10 10-10 10"/>
      <path d="M938 120h34M962 110l10 10-10 10"/>
    </g>

    <!-- 1 report -->
    <g transform="translate(40 34)">
      <rect width="270" height="232" rx="18" fill="#111b1f" stroke="#1e2c31" stroke-width="2"/>
      <text x="22" y="40" font-family="'Martian Mono', Menlo, Consolas, monospace" font-size="15" fill="#56676a">01</text>
      <g transform="translate(96 30) rotate(-6 40 36)">
        <rect width="80" height="76" rx="6" fill="#efe7d6"/>
        <path d="M14 20h52M14 34h36M14 48h44" stroke="#a3977c" stroke-width="5" stroke-linecap="round"/>
        <rect x="14" y="58" width="22" height="8" rx="4" fill="#e0563f"/>
      </g>
      <text x="22" y="156" font-size="25" font-weight="700" fill="#efe7d6">A report comes in</text>
      <text x="22" y="186" font-size="18" fill="#8b9b9d">commit, command, input</text>
      <text x="22" y="210" font-size="18" fill="#8b9b9d">files and the claimed crash</text>
    </g>

    <!-- 2 build -->
    <g transform="translate(350 34)">
      <rect width="270" height="232" rx="18" fill="#111b1f" stroke="#1e2c31" stroke-width="2"/>
      <text x="22" y="40" font-family="'Martian Mono', Menlo, Consolas, monospace" font-size="15" fill="#56676a">02</text>
      <g transform="translate(88 28)">
        <rect x="0" y="22" width="96" height="62" rx="10" fill="none" stroke="#c8a45c" stroke-width="5"/>
        <path d="M24 22v-8a24 24 0 0 1 48 0v8" fill="none" stroke="#c8a45c" stroke-width="5"/>
        <text x="48" y="62" text-anchor="middle" font-family="'Martian Mono', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#c8a45c">ASan</text>
      </g>
      <text x="22" y="156" font-size="25" font-weight="700" fill="#efe7d6">Build that commit</text>
      <text x="22" y="186" font-size="18" fill="#8b9b9d">with sanitizers, using flags</text>
      <text x="22" y="210" font-size="18" fill="#8b9b9d">the maintainers own</text>
    </g>

    <!-- 3 run -->
    <g transform="translate(660 34)">
      <rect width="270" height="232" rx="18" fill="#111b1f" stroke="#1e2c31" stroke-width="2"/>
      <text x="22" y="40" font-family="'Martian Mono', Menlo, Consolas, monospace" font-size="15" fill="#56676a">03</text>
      <rect x="74" y="34" width="124" height="74" rx="14" fill="none" stroke="#6aa3cf" stroke-width="4" stroke-dasharray="8 7"/>
      <circle cx="104" cy="71" r="14" fill="#e0563f"/>
      <circle cx="136" cy="71" r="14" fill="#e0563f"/>
      <circle cx="168" cy="71" r="14" fill="#e0563f"/>
      <text x="22" y="156" font-size="25" font-weight="700" fill="#efe7d6">Run it, sealed off</text>
      <text x="22" y="186" font-size="18" fill="#8b9b9d">several times, no network,</text>
      <text x="22" y="210" font-size="18" fill="#8b9b9d">CPU, memory and time limits</text>
    </g>

    <!-- 4 verdict -->
    <g transform="translate(970 34)">
      <rect width="270" height="232" rx="18" fill="#111b1f" stroke="#1e2c31" stroke-width="2"/>
      <text x="22" y="40" font-family="'Martian Mono', Menlo, Consolas, monospace" font-size="15" fill="#56676a">04</text>
      <g font-family="'Martian Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700">
        <rect x="56" y="24" width="158" height="28" rx="14" fill="#e0563f" fill-opacity=".15" stroke="#e0563f" stroke-width="2"/>
        <text x="135" y="43" text-anchor="middle" fill="#e0563f">REAL CRASH</text>
        <rect x="56" y="58" width="158" height="28" rx="14" fill="#4fb58d" fill-opacity=".15" stroke="#4fb58d" stroke-width="2"/>
        <text x="135" y="77" text-anchor="middle" fill="#4fb58d">NO CRASH</text>
        <rect x="56" y="92" width="158" height="28" rx="14" fill="#a391dd" fill-opacity=".15" stroke="#a391dd" stroke-width="2"/>
        <text x="135" y="111" text-anchor="middle" fill="#a391dd">DIFFERENT</text>
      </g>
      <text x="22" y="156" font-size="25" font-weight="700" fill="#efe7d6">Give a verdict</text>
      <text x="22" y="186" font-size="18" fill="#8b9b9d">compare to the claim and</text>
      <text x="22" y="210" font-size="18" fill="#8b9b9d">group duplicate reports</text>
    </g>
  </g>
</svg>
