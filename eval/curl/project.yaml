version: 1
id: curl
repo: https://github.com/curl/curl.git
image: gcc:15
profiles:
  asan:
    build: >-
      autoreconf -fi
      && ./configure --disable-shared --without-ssl --disable-ldap
      --disable-ldaps --without-libpsl --without-brotli --without-zstd
      --without-nghttp2 --without-libidn2 --without-librtmp
      CFLAGS="-fsanitize=address -g -O1 -fno-omit-frame-pointer"
      LDFLAGS="-fsanitize=address"
      && make -j2 src/curl
    outputs: [src/curl]
    env:
      ASAN_OPTIONS: detect_leaks=0:symbolize=1
limits:
  cpus: 2
  memory_mb: 2048
  build_timeout_seconds: 900
