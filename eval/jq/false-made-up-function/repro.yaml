version: 1
project: jq
commit: c9a51565214eece8f1053089739aea73145bfd6b
profile: asan
run:
  cmd: ["bin/jq", ".", "poc/num.json"]
  timeout_seconds: 30
  repeat: 3
files:
  - num.json
claim:
  sanitizer: address
  kind: heap-buffer-overflow
  frame: jvp_number_scientific_print
  text: |
    jvp_number_scientific_print in jv_print.c overflows a heap buffer when it
    prints a number with a negative exponent.
