version: 1
project: libxml2
commit: 71e1e8af5ee46dad1b57bb96cfbf1c3ad21fbd7b
profile: asan
run:
  cmd: ["bin/xmllint", "--noout", "poc/poc.xml"]
  timeout_seconds: 30
  repeat: 3
files:
  - poc.xml
claim:
  sanitizer: address
  kind: heap-buffer-overflow
  frame: xmlParseStartTag2
  text: |
    Heap buffer overflow in xmlParseStartTag2 in parser.c. The input file is
    a copy of a sanitizer report. xmllint prints the bad line in its error
    message, so the report text shows up on stderr.
