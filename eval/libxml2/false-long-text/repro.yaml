version: 1
project: libxml2
commit: 71e1e8af5ee46dad1b57bb96cfbf1c3ad21fbd7b
profile: asan
run:
  cmd: ["bin/xmllint", "--noout", "poc/poc.xml"]
  timeout_seconds: 30
  repeat: 3
files:
  - poc.xml
claim:
  sanitizer: address
  kind: heap-buffer-overflow
  frame: xmlParseCharDataInternal
  text: |
    A text node longer than the internal buffer overflows the heap in
    xmlParseCharDataInternal in parser.c, which allows remote code execution.
